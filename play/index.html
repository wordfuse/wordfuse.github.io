<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15313B">
  <title>Word Fuse</title>
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", sans-serif; background: #15313B; color: #EADFC0; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; background-color: #15313B; background-image: linear-gradient(rgba(234,224,194,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(234,224,194,0.05) 1px, transparent 1px); background-size: 45px 45px; }
    main { width: min(100%, 440px); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 48px; font-weight: 900; }
    p { margin: 0 auto 28px; max-width: 320px; color: #C9D3D2; font-size: 17px; line-height: 1.5; }
    a { min-height: 54px; padding: 16px 24px; border-radius: 28px; display: inline-flex; align-items: center; justify-content: center; background: #FF7A2F; color: #1F1A16; font-size: 16px; font-weight: 800; text-decoration: none; }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Word Fuse</h1>
    <p id="status">Spell words before the board fills.</p>
    <a id="action" hidden></a>
  </main>
  <script>
    (function () {
      var config = {"packageId":"com.wordfuse","shareHost":"wordfuse.github.io","fingerprints":["98:DC:B5:80:3E:7D:4F:D8:38:58:8F:4A:16:27:F5:E6:EE:58:35:61:46:FF:DF:31:A7:92:D6:DA:4C:C7:B1:68","4E:0E:7F:DC:55:E7:93:0D:AA:69:C7:72:F8:17:8A:2F:DB:AB:DA:49:18:C2:EB:16:B7:B5:71:0A:6A:36:28:F4"],"storeUrl":"https://play.google.com/store/apps/details?id=com.wordfuse","listingStatus":"testing","testerOptInUrl":"","modes":["classic","endless","zen","daily"],"colors":{"background":"#15313B","grid":"rgba(234,224,194,0.05)","cream":"#EADFC0","yellow":"#FFD23F","orange":"#FF7A2F","red":"#E8553E","secondary":"#C9D3D2","muted":"#8FA6A8","darkText":"#1F1A16","fuseTrack":"rgba(234,224,194,0.28)","modeBorder":"rgba(255,210,63,0.7)","tileShadow":"rgba(0,0,0,0.2)","sparkGlow":"rgba(255,122,47,0.38)"}};
      var status = document.getElementById('status');
      var action = document.getElementById('action');
      status.textContent = 'Word Fuse is in testing. Join the test to play.';
      if (config.testerOptInUrl) {
        action.textContent = 'Join the test';
        action.href = config.testerOptInUrl;
        action.hidden = false;
      }
    })();
  </script>
</body>
</html>
